name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned tool downloads
        uses: actions/cache@v4
        with:
          path: .cache/ci-downloads
          key: ${{ runner.os }}-${{ runner.arch }}-rojo-7.7.1-luau-lsp-1.70.1
      - name: Install pinned tools
        run: |
          ./tools/ci/install-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Analyze Luau
        run: ./tools/analyze.sh
      - name: Lint data when available
        run: |
          if [ -f tools/lint_data.py ]; then
            python3 tools/lint_data.py
          fi
      - name: Run tests when available
        run: |
          if [ -f tools/test.sh ]; then
            ./tools/test.sh
          fi
